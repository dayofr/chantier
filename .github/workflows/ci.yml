name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          extensions: intl, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0

      - name: CSS Tailwind
        run: php bin/console tailwind:build

      - name: PHPUnit (dont le hook sh)
        run: composer test

      - name: Hooks PowerShell
        shell: pwsh
        run: ./tests/ClaudeCode/powershell-hooks.ps1

  image:
    name: Image (construction et démarrage)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construction amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: chantier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Démarrage, healthcheck, pages et MCP
        run: |
          docker run -d --name chantier -p 8080:8080 chantier:ci
          status=starting
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' chantier)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs chantier
          [ "$status" = healthy ] || { echo "Conteneur non sain : $status"; exit 1; }
          # L'application (processus 1) ne doit pas tourner en root ; docker exec, lui, ouvre un shell root.
          uid=$(docker exec chantier sh -c 'grep ^Uid /proc/1/status | cut -f2')
          echo "uid du processus 1 : $uid"
          test "$uid" != 0
          curl -fsS -o /dev/null http://localhost:8080/fr
          curl -fsS -o /dev/null http://localhost:8080/api/docs
          # Appel MCP en révision 2026-07-28, comme Claude Code.
          curl -fsS http://localhost:8080/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/call' -H 'Mcp-Name: list_projects' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"list_projects","arguments":{},"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientCapabilities":{},"io.modelcontextprotocol/clientInfo":{"name":"ci","version":"1"}}}}' \
            | grep -q '\\"projects\\"'

version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    groups:
      symfony:
        patterns: ['symfony/*']
      api-platform:
        patterns: ['api-platform/*']
    commit-message:
      prefix: composer

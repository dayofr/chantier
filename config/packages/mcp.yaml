mcp:
    servers:
        chantier:
            name: chantier
            version: 0.1.0
            description: 'Suivi de projet pour Claude Code : projets, initiatives, epics, tickets, journal.'
            instructions: |
                Chantier est le tableau de suivi de ton travail. Hiérarchie : Project > Initiative > Epic > Ticket.
                Début de séance : start_session avec l'objectif (renvoie les résumés des séances précédentes),
                puis get_next_ticket ou search_tickets. Passe le ticket en in_progress.
                Pendant : log_activity pour chaque étape notable (décision, commit, blocage, tests).
                Après : update_ticket (in_review ou done), coche les sous-tâches, add_link pour les commits.
                Crée les tickets manquants avec create_tickets plutôt que de travailler hors ticket.
                Après chaque étape importante et en fin de séance : save_session_summary avec le résumé
                complet de la conversation (demandes, travail fait, points ouverts) et les décisions prises.
            registry: ['*']
            transports:
                http: true
                stdio: false
            http:
                path: /mcp
                allowed_hosts: false
            session:
                store: file
                directory: '%kernel.project_dir%/var/mcp-sessions'
                ttl: 86400

; Réglages de production, en complément de php.ini-production.
expose_php = Off
memory_limit = 256M
date.timezone = UTC

realpath_cache_size = 4096K
realpath_cache_ttl = 600

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code ne change pas dans une image : pas de vérification des fichiers.
opcache.validate_timestamps = 0

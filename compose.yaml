# Chantier : image publiée sur GitHub Container Registry.
#
#   docker compose up -d            # télécharge l'image publiée
#   docker compose up -d --build    # construit l'image depuis les sources
#
# Données dans le volume nommé chantier-data. Pour un dossier de l'hôte (NAS) : compose.nas.yaml.
services:
  chantier:
    image: ${CHANTIER_IMAGE:-ghcr.io/dayofr/chantier:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${CHANTIER_PORT:-8080}:8080"
    environment:
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Paris}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
    volumes:
      - chantier-data:/var/lib/chantier

volumes:
  chantier-data:
